name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build, Lint & Type Check
    runs-on: herschel-runners
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo run build --filter="./packages/*"

      - name: TypeScript check
        run: pnpm tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  agent-runtime:
    name: Agent Runtime (Python)
    runs-on: herschel-runners
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python + dependencies
        run: uv sync --frozen --all-packages

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy agno-agent-builder/agno_agent_builder agno-agent/agno_agent agno-microsoft-teams/agno_microsoft_teams

      - name: Tests (pytest)
        run: uv run pytest agno-agent-builder/tests agno-microsoft-teams/tests -q

  nexus-queue-conformance:
    name: Nexus-Queue Conformance
    runs-on: herschel-runners
    steps:
      - uses: actions/checkout@v4

      # The cross-language round-trip drives the REAL TS client, so the dist
      # must exist before pytest runs (the test skips loudly otherwise).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TS client
        run: pnpm --filter @zetesis/nexus-queue build

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python + dependencies
        working-directory: backend
        run: uv sync --frozen --all-packages

      # docker run instead of a GH service: service containers can't take
      # command args and NATS needs `-js`; the odd host port avoids collisions
      # on shared self-hosted runners. run_id-suffixed name/port keep concurrent
      # runs on one host from clashing.
      - name: Start NATS JetStream
        run: |
          docker run -d --name nq-ci-nats-${{ github.run_id }} \
            -p 14222:4222 -p 18222:8222 nats:2.11-alpine -js -m 8222
          sleep 2

      - name: Conformance suite
        working-directory: backend
        env:
          NATS_URL: nats://127.0.0.1:14222
        run: uv run pytest nexus-queue/tests/conformance -q

      - name: Stop NATS
        if: always()
        run: docker rm -f nq-ci-nats-${{ github.run_id }} || true
