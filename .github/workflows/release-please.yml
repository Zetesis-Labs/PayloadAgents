name: Release Please

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
      releases_created: ${{ steps.release.outputs.releases_created }}
      agno_agent_builder_released: ${{ steps.release.outputs['backend/agno-agent-builder--release_created'] }}
      agno_agent_builder_tag: ${{ steps.release.outputs['backend/agno-agent-builder--tag_name'] }}
      agno_microsoft_teams_released: ${{ steps.release.outputs['backend/agno-microsoft-teams--release_created'] }}
      agno_microsoft_teams_tag: ${{ steps.release.outputs['backend/agno-microsoft-teams--tag_name'] }}
      payload_documents_worker_builder_released: ${{ steps.release.outputs['backend/payload-documents-worker-builder--release_created'] }}
      payload_documents_worker_builder_tag: ${{ steps.release.outputs['backend/payload-documents-worker-builder--tag_name'] }}
      nexus_queue_released: ${{ steps.release.outputs['backend/nexus-queue--release_created'] }}
      nexus_queue_tag: ${{ steps.release.outputs['backend/nexus-queue--tag_name'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm turbo run build --filter="./packages/*"
      - name: Publish changed npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -uo pipefail
          paths='${{ needs.release-please.outputs.paths_released }}'
          echo "Released paths: $paths"
          # No `set -e`: one already-published package (npm 403) must not abort
          # the rest. Skip versions already on the registry; fail the job only if
          # a real publish fails. `done < <(...)` keeps the loop in this shell so
          # `fail` survives.
          fail=0
          while IFS= read -r path; do
            case "$path" in
              packages/*)
                pkg_name=$(node -p "require('./$path/package.json').name")
                version=$(node -p "require('./$path/package.json').version")
                if npm view "$pkg_name@$version" version >/dev/null 2>&1; then
                  echo "::notice::$pkg_name@$version already published — skipping"
                  continue
                fi
                echo "::group::Publishing $pkg_name@$version ($path)"
                if ! pnpm --filter "$pkg_name" publish --no-git-checks --access public; then
                  echo "::error::failed to publish $pkg_name@$version"
                  fail=1
                fi
                echo "::endgroup::"
                ;;
              *)
                echo "Skipping non-npm path: $path"
                ;;
            esac
          done < <(echo "$paths" | jq -r '.[]')
          exit "$fail"

  publish-agno-agent-builder:
    needs: [release-please, publish-agno-microsoft-teams]
    if: |
      always() &&
      needs.release-please.outputs.agno_agent_builder_released == 'true' &&
      (
        needs.release-please.outputs.agno_microsoft_teams_released != 'true' ||
        needs.publish-agno-microsoft-teams.result == 'success'
      )
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agno-agent-builder
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.agno_agent_builder_tag }}
      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Build distribution
        run: |
          rm -rf dist
          uv build --package agno-agent-builder
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: backend/dist

  publish-agno-microsoft-teams:
    needs: release-please
    if: needs.release-please.outputs.agno_microsoft_teams_released == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agno-microsoft-teams
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.agno_microsoft_teams_tag }}
      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Build distribution
        run: |
          rm -rf dist
          uv build --package agno-microsoft-teams
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: backend/dist

  publish-nexus-queue:
    needs: release-please
    if: needs.release-please.outputs.nexus_queue_released == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nexus-queue
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.nexus_queue_tag }}
      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Build distribution
        run: |
          rm -rf dist
          uv build --package nexus-queue
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: backend/dist

  publish-payload-documents-worker-builder:
    needs: [release-please, publish-nexus-queue]
    if: |
      always() &&
      needs.release-please.outputs.payload_documents_worker_builder_released == 'true' &&
      (
        needs.release-please.outputs.nexus_queue_released != 'true' ||
        needs.publish-nexus-queue.result == 'success'
      )
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/payload-documents-worker-builder
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.payload_documents_worker_builder_tag }}
      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Build distribution
        run: |
          rm -rf dist
          uv build --package payload-documents-worker-builder
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: backend/dist

  cleanup-failed-releases:
    # release-please creates the tag + GitHub Release as part of merging the
    # release PR, *before* any publish job runs. If a publish job then fails
    # (build error, registry outage, ...), the tag/release is left pointing at
    # a version that was never actually published. This job deletes those
    # orphans so a git tag always means "this is on npm/PyPI".
    needs:
      - release-please
      - publish-npm
      - publish-agno-agent-builder
      - publish-agno-microsoft-teams
      - publish-nexus-queue
      - publish-payload-documents-worker-builder
    if: always() && needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Delete tags/releases for packages that failed to publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          delete_tag() {
            tag="$1"
            [ -z "$tag" ] && return 0
            echo "::warning::publish failed — deleting orphaned release/tag $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          }

          # npm packages (packages/*) are all built + published together in publish-npm
          if [ "${{ needs.publish-npm.result }}" = "failure" ]; then
            paths='${{ needs.release-please.outputs.paths_released }}'
            while IFS= read -r path; do
              case "$path" in
                packages/*)
                  component=$(basename "$path")
                  version=$(node -p "require('./$path/package.json').version")
                  delete_tag "${component}-v${version}"
                  ;;
              esac
            done < <(echo "$paths" | jq -r '.[]')
          fi

          # Python/PyPI packages each have their own job + known tag output
          [ "${{ needs.publish-agno-agent-builder.result }}" = "failure" ] && delete_tag "${{ needs.release-please.outputs.agno_agent_builder_tag }}"
          [ "${{ needs.publish-agno-microsoft-teams.result }}" = "failure" ] && delete_tag "${{ needs.release-please.outputs.agno_microsoft_teams_tag }}"
          [ "${{ needs.publish-nexus-queue.result }}" = "failure" ] && delete_tag "${{ needs.release-please.outputs.nexus_queue_tag }}"
          [ "${{ needs.publish-payload-documents-worker-builder.result }}" = "failure" ] && delete_tag "${{ needs.release-please.outputs.payload_documents_worker_builder_tag }}"

          exit 0
