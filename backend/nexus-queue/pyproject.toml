[project]
name = "nexus-queue"
version = "0.1.4"
description = "Nexus-Queue — portable taskiq + Redis Streams worker runtime: namespaced streams, versioned envelope, ports-and-adapters, retry/DLQ/idempotency/tracing/metrics middleware."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Zetesis Labs" }]
keywords = ["taskiq", "redis", "queue", "worker", "ports-and-adapters", "dlq"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "nats-py>=2.9",
    "opentelemetry-api>=1.35",
    "opentelemetry-exporter-otlp-proto-http>=1.35",
    "opentelemetry-sdk>=1.35",
    "prometheus-client>=0.20",
    "pydantic>=2.9",
    "redis>=5.0",
    "structlog>=24.1",
    "taskiq>=0.11.18",
    "taskiq-redis>=1.1.1",
    "uvicorn[standard]>=0.34",
]

[project.urls]
Homepage = "https://github.com/Zetesis-Labs/PayloadAgents"
Repository = "https://github.com/Zetesis-Labs/PayloadAgents"
Issues = "https://github.com/Zetesis-Labs/PayloadAgents/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexus_queue"]

[tool.hatch.build.targets.wheel.force-include]
"nexus_queue/py.typed" = "nexus_queue/py.typed"
