# Contrato de cola (prototipo D13) — fuente única de la que se proyecta todo.
channel: nq.zp.jobs.transcribe
operations:
  send: [zp-web]
  receive: [transcribe-worker]
message:
  payload:
    $ref: "./schemas/TranscribeJob.json"
  headers:
    nq_idem: { type: string, required: true }
    nq_trace: { type: string, required: false }
policy:
  retry:
    backoff: [30s, 2m, 10m]
    max_attempts: 4
  dlq: nq.zp.jobs.transcribe.dlq
  processing_budget: 25m
scaling:
  profile: batch
  scaleToZero: true
  lagThreshold: 10
bindings:
  jetstream:
    stream: NQ_ZP_JOBS_TRANSCRIBE
    deliver_policy: all
