services:
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222", "-D"]
    ports:
      - "4222:4222"   # client
      - "8222:8222"   # monitoring HTTP (lo que consume el scaler de KEDA)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15
