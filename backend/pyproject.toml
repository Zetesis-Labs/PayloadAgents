[project]
name = "zetesis-backend"
version = "0.0.0"
description = "Workspace root for Zetesis Python services."
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["agno-agent-builder", "agno-agent", "agno-microsoft-teams", "payload-documents-worker-builder", "payload-documents-worker", "nexus-queue"]

[tool.uv.sources]
agno-agent-builder = { workspace = true }
agno-agent = { workspace = true }
agno-microsoft-teams = { workspace = true }
payload-documents-worker-builder = { workspace = true }
payload-documents-worker = { workspace = true }
nexus-queue = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pyright>=1.1",
    "pytest-asyncio>=0.24",
    "pytest>=8.3",
    "ruff>=0.9",
    "taskiq[reload]>=0.11.18",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# spike-jetstream is the JetStream evaluation bench (throwaway lab scripts,
# see its EVALUATION.md) — not shipping code, not lint-gated
extend-exclude = ["nexus-queue/spike-jetstream"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "S", "SIM", "RUF"]
ignore = [
    "E501",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# S101 = `assert` (idiomatic in tests)
# S105/S106/S107 = "possible hardcoded password" — bandit heuristic that fires on any literal containing "token", "secret", "password" in test fixtures
"**/tests/**/*.py" = ["S101", "S105", "S106", "S107"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["agno.*", "msal", "taskiq", "taskiq.*", "taskiq_redis", "taskiq_redis.*", "prometheus_client", "prometheus_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
