[project]
name = "payload-documents-worker-builder"
version = "0.1.5"
description = "Payload CMS documents worker on the Nexus-Queue runtime — LlamaParse parse-document handler over JobStatePort."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Zetesis Labs" }]
keywords = ["payload", "worker", "nexus-queue", "taskiq", "llamaparse"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28",
    "nexus-queue>=0.1.0",
    "pydantic>=2.9",
    "structlog>=24.1",
]

[project.urls]
Homepage = "https://github.com/Zetesis-Labs/PayloadAgents"
Repository = "https://github.com/Zetesis-Labs/PayloadAgents"
Issues = "https://github.com/Zetesis-Labs/PayloadAgents/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["payload_documents_worker_builder"]

[tool.hatch.build.targets.wheel.force-include]
"payload_documents_worker_builder/py.typed" = "payload_documents_worker_builder/py.typed"
